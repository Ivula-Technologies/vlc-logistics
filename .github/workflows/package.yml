name: Build cPanel zip
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: php -l site/contact.php
      - name: Zip the site for cPanel
        run: cd site && zip -qr ../vlc-logistics-website.zip . -x '.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: vlc-logistics-website
          path: vlc-logistics-website.zip
